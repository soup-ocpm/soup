services:
  angular:
    build:
      context: . # Repository root: the app compiles @soup/sdk from soup-packages/sdk
      dockerfile: soup-app/Dockerfile
    container_name: soup-app
    ports:
      # Local use only: every port is published on 127.0.0.1, never on the network.
      - "127.0.0.1:4200:80" # The app on http://localhost:4200 (Nginx in the container)
    depends_on:
      - flask
    networks:
      - app-network

  flask:
    build:
      context: . # Repository root: the image also needs soup-packages/
      dockerfile: soup-server/Dockerfile
    container_name: soup-engine
    ports:
      - "127.0.0.1:8080:8080" # The API, called by the app from the browser (CORS: SOUP_CORS_ORIGINS)
    networks:
      - app-network
    environment:
      - MEMGRAPH_HOST=memgraph
      - MEMGRAPH_PORT=7687
      # Development: allow installing packages at runtime. A package runs
      # code with the privileges of the server and of the browser.
      - SOUP_ALLOW_PACKAGE_INSTALL=true
      - SOUP_INSTALLED_PACKAGES_DIR=/data/soup-packages
      # The datasets are files in soup-volume, mounted here and in memgraph
      # on the same path: the backend writes them, Memgraph reads them with
      # LOAD CSV. No Docker socket: the backend cannot reach the Docker
      # daemon (SOUP_STORAGE_KIND=docker, which needs it, is opt-in).
      - SOUP_STORAGE_KIND=local
      - SOUP_LOCAL_STORAGE_ROOT=/soup
    volumes:
      - soup-volume:/soup
      - soup-installed-packages:/data/soup-packages # Packages installed at runtime
    depends_on:
      volume-init:
        condition: service_completed_successfully

  # One-off: gives the files of the two volumes to the "memgraph" user of
  # the Memgraph image, the user the backend image also runs as (same
  # UID/GID, soup-server/Dockerfile). Volumes written before, when the
  # backend wrote through the Docker socket as root, have root's files.
  # Only the files with another owner are changed; nothing is removed or
  # moved. It exits at once when there is nothing to change.
  volume-init:
    image: memgraph/memgraph-mage:3.13.2
    user: root
    entrypoint: ["sh", "-c", "find /soup /data/soup-packages \\( ! -user memgraph -o ! -group memgraph \\) -exec chown -h memgraph:memgraph {} +"]
    volumes:
      - soup-volume:/soup
      - soup-installed-packages:/data/soup-packages
    networks:
      - app-network

  # Memgraph and its web interface as two images with the same pinned
  # version (memgraph/memgraph-platform, which bundled them, is deprecated:
  # its last release is 2.14.1, February 2024). Check the running version
  # with "SHOW VERSION;" (README.md, "Memgraph"). Update both tags together.
  memgraph:
    image: memgraph/memgraph-mage:3.13.2
    container_name: soup-database
    ports:
      # Memgraph has no user and no password: only this machine can reach it.
      - "127.0.0.1:7687:7687" # Memgraph Bolt protocol
      - "127.0.0.1:7444:7444" # Memgraph HTTP (logs)
    networks:
      - app-network
    volumes:
      - soup-volume:/soup

  lab:
    image: memgraph/lab:3.13.2
    container_name: soup-lab
    ports:
      # Memgraph Lab (web interface) on http://localhost:3300: Windows often
      # reserves the host ports 2981-3080 (Hyper-V/WinNAT), so 3000 cannot be bound.
      - "127.0.0.1:3300:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    depends_on:
      - memgraph
    networks:
      - app-network

volumes:
  soup-volume: # The datasets and the catalog: /soup in flask (writes) and memgraph (LOAD CSV)
    driver: local
  soup-installed-packages: # Packages installed at runtime, and their enabled/disabled state
    driver: local

networks:
  app-network:
    driver: bridge # Use a bridge network for communication between services
