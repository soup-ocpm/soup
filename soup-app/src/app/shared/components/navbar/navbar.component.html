<!--Navigation bar-->
<nav
  class="master"
  aria-label="Navigazione principale">
  <a
    class="navbar-brand"
    href="/welcome">
    <img
      src="icons/favicon.png"
      width="60"
      height="32"
      alt="SOUP" />
  </a>
  <div class="link">
    <p
      role="link"
      tabindex="0"
      (click)="this.goToHome()"
      (keydown.enter)="this.goToHome()">
      Home
    </p>
    @for (item of this.links; track item.path) {
      <p
        role="link"
        tabindex="0"
        [class.active]="this.isActive(item.path)"
        [attr.aria-current]="this.isActive(item.path) ? 'page' : null"
        (click)="this.goTo(item.path)"
        (keydown.enter)="this.goTo(item.path)"
        [textContent]="item.label"></p>
    }
  </div>

  <!--Soup feedback link-->
  @if (this.isWelcomePage()) {
    <div class="soup-feedback">
      <img
        src="icons/icn-light-bulb.svg"
        width="20"
        height="20"
        alt="" />
      <a
        href="https://forms.gle/EoxJVvuXofh8oBku7"
        target="_blank"
        rel="noopener">
        Leave feedback
      </a>
    </div>
  }
</nav>
