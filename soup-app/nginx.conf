# nginx.conf for the application
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Set the root html folder for the application
        root /usr/share/nginx/html;

        # Routes configuration
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Error
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }

        # No proxy to the backend: the app runs in the browser and calls
        # http://127.0.0.1:8080/api/v3 directly (src/environments/environment.ts),
        # the port the backend container publishes on 127.0.0.1. Only the
        # origins of the app are allowed by its CORS (SOUP_CORS_ORIGINS).
    }
}