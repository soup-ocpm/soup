# Continuous integration: the checks of the wiki page "Testing and CI" on every push
# and pull request, one job per area. Python and Node are the versions of
# soup-server/Dockerfile and soup-app/Dockerfile (python:3.12.16-slim,
# node:24.22.0-alpine), Memgraph the image of docker-compose.yaml; the
# tests in soup-server/tests/test_ci_workflow.py keep them aligned.
# See .github/workflows/README.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.16"
  NODE_VERSION: "24.22.0"

jobs:
  backend:
    name: backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12.16"]
    defaults:
      run:
        working-directory: soup-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            soup-server/requirements.txt
            soup-server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (FakeDatabase and in-memory storage, no Docker)
        run: python -m pytest
      - name: ruff, vulture, mypy --strict (zero messages)
        if: matrix.python == '3.12.16'
        run: python scripts/lint.py

  packages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soup-packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: soup-packages/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:packages
      - name: pack of ocel (zip installable at runtime)
        run: npm run pack -- ocel

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            soup-app/package-lock.json
            soup-packages/package-lock.json
      # The e2e backend (soup-server/tests/e2e_server.py) and the zips the specs install.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: soup-server/requirements.txt
      - run: pip install -r soup-server/requirements.txt
      - run: npm ci
        working-directory: soup-packages
      - run: npm ci
        working-directory: soup-app
      - run: npm run lint
        working-directory: soup-app
      - name: unit tests (Vitest, jsdom)
        run: npm run test:v3
        working-directory: soup-app
      - name: production build
        run: npm run build
        working-directory: soup-app
      # playwright.config.ts uses the installed Chrome (channel "chrome").
      - run: npx playwright install --with-deps chrome
        working-directory: soup-app
      - name: end to end (Playwright)
        run: npm run e2e
        working-directory: soup-app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: soup-app/test-results
          if-no-files-found: ignore

  memgraph:
    name: memgraph smoke tests
    runs-on: ubuntu-latest
    services:
      memgraph:
        image: memgraph/memgraph:3.13.2
        ports:
          - 7687:7687
        options: >-
          --health-cmd "echo 'RETURN 1;' | mgconsole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    defaults:
      run:
        working-directory: soup-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: soup-server/requirements.txt
      - run: pip install -r requirements.txt
      # Each script empties the database first: they run one after the other on the same Memgraph.
      - run: python ../soup-packages/ekg_views/tests/memgraph_smoke.py bolt://localhost:7687
      - run: python ../soup-packages/ekg_analysis/tests/memgraph_smoke.py bolt://localhost:7687

  docker:
    name: docker images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: soup-engine
            dockerfile: soup-server/Dockerfile
          - image: soup-app
            dockerfile: soup-app/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built from the repository root, as docker-compose.yaml does; never pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
